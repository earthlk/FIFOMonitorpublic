<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — SN Report</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root{
  --primary:#2563eb;
  --secondary:#4f46e5;
  --danger:#dc2626;
  --success:#16a34a;
  --warning:#f59e0b;
  --bg:#eef2ff;
  --ink:#1e293b;
  --muted:#64748b;
}

*{ -webkit-tap-highlight-color: transparent; }

/* ===== Container ===== */
.wrap{
  max-width:1240px;
  margin:0 auto;
  padding:0 16px;
}
.topbar .wrap{ padding:0; }

body{
  background:var(--bg);
  color:var(--ink);
  font-size:17px;
  line-height:1.5;
  padding-bottom:40px;
}

button, input, select, textarea{ font-size:17px; }

/* ===== Login ===== */
#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.login-card{
  width:100%;
  max-width:360px;
  background:#fff;
  border-radius:20px;
  padding:28px 24px;
  box-shadow:0 10px 30px rgba(37,99,235,.15);
}

/* ===== Top bar ===== */
.topbar{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;
  padding:16px 18px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 4px 14px rgba(0,0,0,.12);
}
.topbar h1{ font-size:20px; font-weight:800; margin:0; }

.stat-row{ display:flex; gap:8px; margin-top:12px; }
.stat{
  flex:1;
  background:rgba(255,255,255,.16);
  border-radius:12px;
  padding:8px 6px;
  text-align:center;
}
.stat b{ display:block; font-size:20px; line-height:1.2; }
.stat span{ font-size:12px; opacity:.9; }

/* ===== Filter chips ===== */
.filter-bar{
  display:flex;
  gap:8px;
  padding:14px 0 6px;
  overflow-x:auto;
}
.chip{
  flex:0 0 auto;
  border:1.5px solid #cbd5e1;
  background:#fff;
  color:var(--muted);
  border-radius:999px;
  padding:7px 16px;
  font-size:15px;
  font-weight:600;
}
.chip.active{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff;
}

/* ===== Groups ===== */
.date-header{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;
  border-radius:12px;
  padding:10px 16px;
  margin:22px 0 10px;
  font-weight:700;
  font-size:16px;
}
.code-header{
  margin:16px 0 8px;
  font-weight:700;
  font-size:15px;
  color:var(--secondary);
  display:flex;
  align-items:center;
  gap:8px;
}
.code-header .zone-tag{
  background:#e0e7ff;
  color:var(--secondary);
  border-radius:6px;
  padding:2px 8px;
  font-size:13px;
  font-weight:600;
}

/* ===== Report card ===== */
.report-card{
  background:#fff;
  border-radius:14px;
  padding:14px 16px;
  margin:0 0 10px;
  box-shadow:0 3px 10px rgba(0,0,0,.07);
  border-left:5px solid #cbd5e1;
  display:flex;
  flex-direction:column;
}
.report-card .action-row{ margin-top:auto; }

.card-grid{ display:block; }
.report-card.pending { border-left-color:var(--warning); }
.report-card.approved{ border-left-color:var(--success); }
.report-card.rejected{ border-left-color:var(--danger); }

.sn-line{
  font-weight:700;
  font-size:18px;
  word-break:break-all;
  margin-bottom:6px;
}
.meta{
  font-size:14px;
  color:var(--muted);
  display:flex;
  flex-wrap:wrap;
  gap:4px 14px;
  margin-bottom:8px;
}
.reason{
  background:#f8fafc;
  border-radius:8px;
  padding:8px 10px;
  font-size:15px;
  margin-bottom:10px;
}
.reason .note{ color:var(--muted); font-size:14px; display:block; margin-top:3px; }

.badge-status{ border-radius:999px; padding:4px 12px; font-size:13px; font-weight:700; color:#fff; }
.badge-pending { background:var(--warning); }
.badge-approved{ background:var(--success); }
.badge-rejected{ background:var(--danger); }

.admin-note{
  border-top:1px dashed #e2e8f0;
  margin-top:10px;
  padding-top:8px;
  font-size:14px;
  color:var(--muted);
}

.action-row{ display:flex; gap:8px; margin-top:10px; }
.action-row .btn{ flex:1; font-weight:700; border-radius:10px; padding:9px 0; }

/* ===== Empty / loading ===== */
.state-box{
  text-align:center;
  color:var(--muted);
  padding:60px 24px;
}
.state-box .icon{ font-size:44px; display:block; margin-bottom:10px; }

/* ===== Toast ===== */
.toast-box{ position:fixed; left:0; right:0; bottom:24px; display:flex; justify-content:center; z-index:99999; pointer-events:none; }
.toast-msg{
  background:#0f172a; color:#fff; padding:12px 22px; border-radius:999px;
  font-size:15px; font-weight:600; box-shadow:0 6px 18px rgba(0,0,0,.25);
  opacity:0; transform:translateY(12px); transition:.25s;
}
.toast-msg.show{ opacity:1; transform:translateY(0); }
.toast-msg.ok  { background:var(--success); }
.toast-msg.warn{ background:var(--danger); }

/* ===== PC layout ===== */
@media (min-width: 992px){
  body{ font-size:16px; }
  button, input, select, textarea{ font-size:16px; }

  .topbar{ padding:14px 24px; }
  .topbar .wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
  }
  .topbar h1{ font-size:22px; white-space:nowrap; }

  .stat-row{ margin-top:0; flex:0 0 auto; gap:10px; }
  .stat{ min-width:92px; padding:6px 12px; }
  .stat b{ font-size:22px; }

  .filter-bar{ padding:18px 0 4px; overflow:visible; }
  .chip{ cursor:pointer; transition:.15s; }
  .chip:hover{ border-color:var(--primary); color:var(--primary); }
  .chip.active:hover{ color:#fff; }

  .date-header{ font-size:17px; padding:11px 20px; }
  .code-header{ font-size:16px; }

  /* หลายคอลัมน์ตามความกว้างจอ */
  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(360px, 1fr));
    gap:12px;
    align-items:start;
  }
  .report-card{
    margin:0;
    transition:transform .15s, box-shadow .15s;
  }
  .report-card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,.10);
  }
  .action-row .btn{ cursor:pointer; }

  .state-box{ padding:80px 24px; }
}

@media (min-width: 1400px){
  .wrap{ max-width:1400px; }
}

@media (prefers-reduced-motion: reduce){
  *{ transition:none !important; animation:none !important; }
}
</style>
</head>
<body>

<!-- ==================== LOGIN ==================== -->
<div id="loginScreen">
  <div class="login-card">
    <div class="text-center mb-3">
      <div style="font-size:40px;">🔐</div>
      <h5 class="fw-bold mb-1">Admin — SN Report</h5>
      <div class="text-muted" style="font-size:14px;">ใส่รหัสผ่านเพื่อเข้าตรวจสอบรายการ</div>
    </div>
    <input type="password" id="pwInput" class="form-control mb-2" placeholder="รหัสผ่าน" autocomplete="current-password">
    <div id="pwError" class="text-danger mb-2" style="font-size:14px; display:none;">รหัสผ่านไม่ถูกต้อง ลองใหม่อีกครั้ง</div>
    <button class="btn btn-primary w-100 fw-bold py-2" onclick="checkPassword()">เข้าสู่ระบบ</button>
  </div>
</div>

<!-- ==================== ADMIN ==================== -->
<div id="adminScreen" style="display:none;">

  <div class="topbar">
    <div class="wrap">
      <div class="d-flex align-items-center justify-content-between gap-3">
        <h1>📋 SN Report</h1>
        <button class="btn btn-light btn-sm fw-bold" onclick="loadReports()">🔄 โหลดใหม่</button>
      </div>
      <div class="stat-row">
        <div class="stat"><b id="statPending">0</b><span>รอตรวจ</span></div>
        <div class="stat"><b id="statApproved">0</b><span>อนุมัติ</span></div>
        <div class="stat"><b id="statRejected">0</b><span>ปฏิเสธ</span></div>
        <div class="stat"><b id="statTotal">0</b><span>ทั้งหมด</span></div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="filter-bar">
      <button class="chip active" data-filter="pending"  onclick="setFilter('pending', this)">รอตรวจ</button>
      <button class="chip" data-filter="approved" onclick="setFilter('approved', this)">อนุมัติแล้ว</button>
      <button class="chip" data-filter="rejected" onclick="setFilter('rejected', this)">ปฏิเสธ</button>
      <button class="chip" data-filter="all"      onclick="setFilter('all', this)">ทั้งหมด</button>
    </div>

    <div id="reportList"></div>
  </div>
</div>

<!-- ==================== CONFIRM MODAL ==================== -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:18px;">
      <div class="modal-body p-4">
        <div id="confirmTitle" class="fw-bold mb-1" style="font-size:19px;"></div>
        <div id="confirmSN" class="text-muted mb-3" style="font-size:14px; word-break:break-all;"></div>

        <label class="fw-bold mb-1" style="font-size:15px;">ความเห็น Admin</label>
        <textarea id="adminComment" class="form-control mb-3" rows="3" placeholder="ระบุเหตุผล (ถ้ามี)"></textarea>

        <div class="d-flex gap-2">
          <button class="btn btn-light flex-fill fw-bold" data-bs-dismiss="modal">ยกเลิก</button>
          <button id="confirmBtn" class="btn btn-primary flex-fill fw-bold" onclick="submitDecision()">ยืนยัน</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast-box"><div id="toastMsg" class="toast-msg"></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ==========================================================
// ⚙️ CONFIG — แก้รหัสผ่านตรงนี้
// ==========================================================
const ADMIN_PASSWORD = "CHANGE_ME";

const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw9FUQVEOripWQc7x2l7wmL1krMRsh5M_ouW5LGLJonBOXW62H4J850YvPUigJfrFnl/exec";

async function callGAS(actionName, payloadData = {}) {
  const response = await fetch(GAS_API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: actionName, data: payloadData })
  });
  const result = await response.json();
  if (result.status === "error") throw new Error(result.message);
  return result.data;
}

// ==========================================================
// 🔐 Login
// ==========================================================
function checkPassword(){
  const input = document.getElementById("pwInput");
  if (input.value === ADMIN_PASSWORD){
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("adminScreen").style.display = "block";
    loadReports();
  } else {
    document.getElementById("pwError").style.display = "block";
    input.value = "";
    input.focus();
  }
}
document.getElementById("pwInput").addEventListener("keydown", e => {
  if (e.key === "Enter") checkPassword();
});

// ==========================================================
// 📦 State
// ==========================================================
let allReports = [];
let currentFilter = "pending";
let pendingDecision = null;   // { rowIndex, status, sn }

// ==========================================================
// 🔄 Load
// ==========================================================
async function loadReports(){
  const list = document.getElementById("reportList");
  list.innerHTML = `<div class="state-box"><span class="icon">⏳</span>กำลังโหลดรายการ...</div>`;
  try {
    const data = await callGAS("getSNReports");
    allReports = Array.isArray(data) ? data : [];
    updateStats();
    renderReports();
  } catch (err){
    list.innerHTML = `<div class="state-box">
        <span class="icon">⚠️</span>
        โหลดรายการไม่สำเร็จ<br>
        <span style="font-size:14px;">${escapeHtml(err.message)}</span><br>
        <button class="btn btn-primary btn-sm mt-3 fw-bold" onclick="loadReports()">ลองใหม่</button>
      </div>`;
  }
}

// ==========================================================
// 🏷️ Status helper
// ==========================================================
function normalizeStatus(raw){
  const s = String(raw || "").trim().toLowerCase();
  if (s === "approved" || s === "approve" || s === "อนุมัติ") return "approved";
  if (s === "rejected" || s === "reject" || s === "ปฏิเสธ")  return "rejected";
  return "pending";   // ว่าง / pending / รอตรวจสอบ
}

const STATUS_LABEL = { pending:"รอตรวจ", approved:"อนุมัติแล้ว", rejected:"ปฏิเสธ" };

function updateStats(){
  const c = { pending:0, approved:0, rejected:0 };
  allReports.forEach(r => c[normalizeStatus(r.status)]++);
  document.getElementById("statPending").innerText  = c.pending;
  document.getElementById("statApproved").innerText = c.approved;
  document.getElementById("statRejected").innerText = c.rejected;
  document.getElementById("statTotal").innerText    = allReports.length;
}

function setFilter(f, el){
  currentFilter = f;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  el.classList.add("active");
  renderReports();
}

// ==========================================================
// 🖼️ Render — group by reportDate → code
// ==========================================================
function renderReports(){
  const list = document.getElementById("reportList");

  const rows = allReports.filter(r =>
    currentFilter === "all" || normalizeStatus(r.status) === currentFilter
  );

  if (!rows.length){
    list.innerHTML = `<div class="state-box">
        <span class="icon">📭</span>
        ไม่มีรายการในหมวด "${STATUS_LABEL[currentFilter] || 'ทั้งหมด'}"
      </div>`;
    return;
  }

  // group: date → code → [rows]
  const byDate = {};
  rows.forEach(r => {
    const d = fmtDate(r.reportDate);
    const c = String(r.code || "-");
    (byDate[d] = byDate[d] || {});
    (byDate[d][c] = byDate[d][c] || []).push(r);
  });

  const dates = Object.keys(byDate).sort().reverse();

  const html = dates.map(d => {
    const codes = Object.keys(byDate[d]).sort();
    const codeHtml = codes.map(c => {
      const items = byDate[d][c];
      const zone  = items[0].zone || "-";
      const cards = items.map(buildCard).join("");
      return `
        <div class="code-header">
          <span>🏷️ ${escapeHtml(c)}</span>
          <span class="zone-tag">Zone ${escapeHtml(zone)}</span>
          <span class="ms-auto text-muted" style="font-size:13px;">${items.length} SN</span>
        </div>
        <div class="card-grid">${cards}</div>`;
    }).join("");
    return `<div class="date-header">📅 ${escapeHtml(d)}</div>${codeHtml}`;
  }).join("");

  list.innerHTML = html;
}

function buildCard(r){
  const st = normalizeStatus(r.status);
  const isPending = st === "pending";

  const meta = [
    r.rc  ? `RC: ${escapeHtml(r.rc)}`   : "",
    r.age !== "" && r.age != null ? `อายุ: ${escapeHtml(r.age)} วัน` : "",
    r.timestamp ? `แจ้ง: ${escapeHtml(fmtDateTime(r.timestamp))}` : ""
  ].filter(Boolean).map(t => `<span>${t}</span>`).join("");

  const adminNote = (!isPending && (r.adminComment || r.approvedAt))
    ? `<div class="admin-note">
         ${r.adminComment ? `💬 ${escapeHtml(r.adminComment)}<br>` : ""}
         ${r.approvedAt ? `🕐 ${escapeHtml(fmtDateTime(r.approvedAt))}` : ""}
       </div>` : "";

  const actions = isPending
    ? `<div class="action-row">
         <button class="btn btn-success" onclick="askDecision(${r.rowIndex},'Approved','${escapeAttr(r.sn)}')">✅ อนุมัติ</button>
         <button class="btn btn-danger"  onclick="askDecision(${r.rowIndex},'Rejected','${escapeAttr(r.sn)}')">❌ ปฏิเสธ</button>
       </div>` : "";

  return `
  <div class="report-card ${st}">
    <div class="d-flex justify-content-between align-items-start">
      <div class="sn-line">${escapeHtml(r.sn || "-")}</div>
      <span class="badge-status badge-${st}">${STATUS_LABEL[st]}</span>
    </div>
    <div class="meta">${meta}</div>
    <div class="reason">
      📌 ${escapeHtml(r.reason || "ไม่ระบุเหตุผล")}
      ${r.note ? `<span class="note">${escapeHtml(r.note)}</span>` : ""}
    </div>
    ${adminNote}
    ${actions}
  </div>`;
}

// ==========================================================
// ✅ Approve / Reject
// ==========================================================
let confirmModalInstance = null;

function askDecision(rowIndex, status, sn){
  pendingDecision = { rowIndex, status, sn };

  const isApprove = status === "Approved";
  document.getElementById("confirmTitle").innerText = isApprove ? "อนุมัติรายการนี้?" : "ปฏิเสธรายการนี้?";
  document.getElementById("confirmSN").innerText = "SN: " + sn;
  document.getElementById("adminComment").value = "";

  const btn = document.getElementById("confirmBtn");
  btn.className = "btn flex-fill fw-bold " + (isApprove ? "btn-success" : "btn-danger");
  btn.innerText = isApprove ? "ยืนยันอนุมัติ" : "ยืนยันปฏิเสธ";
  btn.disabled = false;

  confirmModalInstance = confirmModalInstance || new bootstrap.Modal(document.getElementById("confirmModal"));
  confirmModalInstance.show();
}

async function submitDecision(){
  if (!pendingDecision) return;
  const { rowIndex, status } = pendingDecision;
  const comment = document.getElementById("adminComment").value.trim();

  const btn = document.getElementById("confirmBtn");
  btn.disabled = true;
  btn.innerText = "กำลังบันทึก...";

  try {
    await callGAS("updateSNReport", { rowIndex, status, adminComment: comment });

    // อัปเดตในหน่วยความจำ ไม่ต้องโหลดใหม่ทั้งหมด
    const target = allReports.find(r => r.rowIndex === rowIndex);
    if (target){
      target.status = status;
      target.adminComment = comment;
      target.approvedAt = new Date().toISOString();
    }

    confirmModalInstance.hide();
    updateStats();
    renderReports();
    showToast(status === "Approved" ? "อนุมัติแล้ว" : "ปฏิเสธแล้ว", "ok");
  } catch (err){
    showToast("บันทึกไม่สำเร็จ: " + err.message, "warn");
    btn.disabled = false;
    btn.innerText = "ยืนยัน";
  } finally {
    pendingDecision = null;
  }
}

// ==========================================================
// 🔧 Utils
// ==========================================================
function fmtDate(v){
  if (!v) return "ไม่ระบุวันที่";
  const d = new Date(v);
  if (isNaN(d)) return String(v);
  return d.toISOString().slice(0,10);
}

function fmtDateTime(v){
  if (!v) return "";
  const d = new Date(v);
  if (isNaN(d)) return String(v);
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, m =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[m]));
}

function escapeAttr(s){
  return String(s ?? "").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;");
}

let toastTimer = null;
function showToast(msg, type = ""){
  const el = document.getElementById("toastMsg");
  el.innerText = msg;
  el.className = "toast-msg show " + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}
</script>

</body>
</html>
