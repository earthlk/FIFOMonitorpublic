<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — SN Report</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root{
  --primary:#2563eb;
  --secondary:#4f46e5;
  --danger:#dc2626;
  --success:#16a34a;
  --warning:#f59e0b;
  --bg:#eef2ff;
  --ink:#1e293b;
  --muted:#64748b;
  --line:#e2e8f0;
}

*{ -webkit-tap-highlight-color: transparent; }

body{
  background:var(--bg);
  color:var(--ink);
  font-size:17px;
  line-height:1.5;
  padding-bottom:40px;
}
button, input, select, textarea{ font-size:17px; }

.wrap{ max-width:1240px; margin:0 auto; padding:0 16px; }
.topbar .wrap{ padding:0; }

/* ===== Login ===== */
#loginScreen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.login-card{
  width:100%; max-width:360px; background:#fff; border-radius:20px;
  padding:28px 24px; box-shadow:0 10px 30px rgba(37,99,235,.15);
}

/* ===== Top bar ===== */
.topbar{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff; padding:16px 18px;
  position:sticky; top:0; z-index:100;
  box-shadow:0 4px 14px rgba(0,0,0,.12);
}
.topbar h1{ font-size:20px; font-weight:800; margin:0; }

.stat-row{ display:flex; gap:8px; margin-top:12px; }
.stat{ flex:1; background:rgba(255,255,255,.16); border-radius:12px; padding:8px 6px; text-align:center; }
.stat b{ display:block; font-size:20px; line-height:1.2; }
.stat span{ font-size:12px; opacity:.9; }

/* ===== Filter chips ===== */
.filter-bar{ display:flex; gap:8px; padding:14px 0 6px; overflow-x:auto; }
.chip{
  flex:0 0 auto; border:1.5px solid #cbd5e1; background:#fff; color:var(--muted);
  border-radius:999px; padding:7px 16px; font-size:15px; font-weight:600;
}
.chip.active{ background:var(--primary); border-color:var(--primary); color:#fff; }

/* ===== Status badge (ใช้ร่วมกัน 2 layout) ===== */
.badge-status{ border-radius:999px; padding:4px 12px; font-size:13px; font-weight:700; color:#fff; white-space:nowrap; }
.badge-pending { background:var(--warning); }
.badge-approved{ background:var(--success); }
.badge-rejected{ background:var(--danger); }

/* ===== Empty / loading ===== */
.state-box{ text-align:center; color:var(--muted); padding:60px 24px; }
.state-box .icon{ font-size:44px; display:block; margin-bottom:10px; }

/* ==========================================================
   MOBILE — card list
   ========================================================== */
.date-header{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff; border-radius:12px; padding:10px 16px;
  margin:22px 0 10px; font-weight:700; font-size:16px;
}
.code-header{
  margin:16px 0 8px; font-weight:700; font-size:15px; color:var(--secondary);
  display:flex; align-items:center; gap:8px;
}
.zone-tag{
  background:#e0e7ff; color:var(--secondary); border-radius:6px;
  padding:2px 8px; font-size:13px; font-weight:600;
}
.report-card{
  background:#fff; border-radius:14px; padding:14px 16px; margin:0 0 10px;
  box-shadow:0 3px 10px rgba(0,0,0,.07); border-left:5px solid #cbd5e1;
}
.report-card.pending { border-left-color:var(--warning); }
.report-card.approved{ border-left-color:var(--success); }
.report-card.rejected{ border-left-color:var(--danger); }

.sn-line{ font-weight:700; font-size:18px; word-break:break-all; margin-bottom:6px; }
.meta{ font-size:14px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 14px; margin-bottom:8px; }
.reason{ background:#f8fafc; border-radius:8px; padding:8px 10px; font-size:15px; margin-bottom:10px; }
.reason .note{ color:var(--muted); font-size:14px; display:block; margin-top:3px; }
.admin-note{ border-top:1px dashed var(--line); margin-top:10px; padding-top:8px; font-size:14px; color:var(--muted); }
.action-row{ display:flex; gap:8px; margin-top:10px; }
.action-row .btn{ flex:1; font-weight:700; border-radius:10px; padding:9px 0; }

#desktopView{ display:none; }

/* ==========================================================
   DESKTOP — master / detail
   ========================================================== */
@media (min-width: 992px){
  body{ font-size:15px; padding-bottom:0; }
  button, input, select, textarea{ font-size:15px; }

  .wrap{ max-width:1560px; padding:0 24px; }
  .topbar{ padding:12px 24px; }
  .topbar .wrap{ display:flex; align-items:center; justify-content:space-between; gap:28px; }
  .topbar h1{ font-size:21px; white-space:nowrap; }
  .stat-row{ margin-top:0; flex:0 0 auto; gap:10px; }
  .stat{ min-width:96px; padding:6px 14px; }
  .stat b{ font-size:21px; }

  .filter-bar{ padding:16px 0 0; overflow:visible; }
  .chip{ cursor:pointer; transition:.15s; }
  .chip:hover{ border-color:var(--primary); color:var(--primary); }
  .chip.active:hover{ color:#fff; }

  #mobileView{ display:none; }

  #desktopView{
    display:grid;
    grid-template-columns:320px minmax(0,1fr);
    gap:18px;
    margin-top:16px;
    height:calc(100vh - 160px);
  }

  /* ---- Sidebar ---- */
  .sidebar{
    background:#fff; border-radius:14px; overflow-y:auto;
    box-shadow:0 3px 12px rgba(0,0,0,.06); padding-bottom:10px;
  }
  .sidebar-title{
    position:sticky; top:0; background:#fff; z-index:2;
    padding:14px 16px 10px; font-weight:800; font-size:15px;
    border-bottom:1px solid var(--line);
  }
  .side-date{
    padding:12px 16px 5px; font-size:12px; font-weight:800;
    letter-spacing:.06em; color:var(--muted); text-transform:uppercase;
  }
  .side-item{
    display:flex; align-items:center; gap:8px;
    padding:10px 16px; cursor:pointer;
    border-left:3px solid transparent; transition:.12s;
  }
  .side-item:hover{ background:#f1f5f9; }
  .side-item.active{ background:#eef2ff; border-left-color:var(--primary); }
  .side-item .code{ font-weight:700; font-size:15px; }
  .side-item.active .code{ color:var(--primary); }
  .side-count{
    margin-left:auto; background:#e2e8f0; color:var(--muted);
    border-radius:999px; padding:1px 9px; font-size:12px; font-weight:700;
  }
  .side-count.has-pending{ background:var(--warning); color:#fff; }

  /* ---- Detail ---- */
  .detail{
    background:#fff; border-radius:14px; overflow:auto;
    box-shadow:0 3px 12px rgba(0,0,0,.06); display:flex; flex-direction:column;
  }
  .detail-head{
    position:sticky; top:0; background:#fff; z-index:3;
    padding:16px 20px 12px; border-bottom:1px solid var(--line);
  }
  .detail-head h2{ font-size:20px; font-weight:800; margin:0; display:flex; align-items:center; gap:10px; }
  .detail-sub{ color:var(--muted); font-size:13px; margin-top:4px; }

  .bulk-bar{
    display:flex; align-items:center; gap:10px; margin-top:12px;
    background:#eef2ff; border-radius:10px; padding:8px 14px; font-size:14px; font-weight:600;
  }
  .bulk-bar .btn{ font-weight:700; padding:5px 14px; }

  table.sn-table{ width:100%; border-collapse:collapse; }
  .sn-table th{
    position:sticky; top:0; background:#f8fafc; z-index:1;
    font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase;
    letter-spacing:.04em; padding:10px 12px; text-align:left;
    border-bottom:1px solid var(--line); white-space:nowrap;
  }
  .sn-table td{ padding:11px 12px; border-bottom:1px solid #f1f5f9; vertical-align:top; font-size:14px; }
  .sn-table tbody tr:hover{ background:#f8fafc; }
  .sn-table tr.is-selected{ background:#eef2ff; }
  .sn-table .col-sn{ font-weight:700; font-size:15px; word-break:break-all; }
  .sn-table .col-note{ color:var(--muted); font-size:13px; }
  .sn-table .col-chk{ width:38px; }
  .sn-table .col-act{ white-space:nowrap; width:1%; }
  .sn-table .col-act .btn{ padding:4px 10px; font-size:13px; font-weight:700; }
  .sn-table input[type=checkbox]{ width:17px; height:17px; cursor:pointer; }
  .table-scroll{ overflow-y:auto; flex:1; }
}

/* ===== Toast ===== */
.toast-box{ position:fixed; left:0; right:0; bottom:24px; display:flex; justify-content:center; z-index:99999; pointer-events:none; }
.toast-msg{
  background:#0f172a; color:#fff; padding:12px 22px; border-radius:999px;
  font-size:15px; font-weight:600; box-shadow:0 6px 18px rgba(0,0,0,.25);
  opacity:0; transform:translateY(12px); transition:.25s;
}
.toast-msg.show{ opacity:1; transform:translateY(0); }
.toast-msg.ok  { background:var(--success); }
.toast-msg.warn{ background:var(--danger); }

@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>

<!-- ==================== LOGIN ==================== -->
<div id="loginScreen">
  <div class="login-card">
    <div class="text-center mb-3">
      <div style="font-size:40px;">🔐</div>
      <h5 class="fw-bold mb-1">Admin — SN Report</h5>
      <div class="text-muted" style="font-size:14px;">ใส่รหัสผ่านเพื่อเข้าตรวจสอบรายการ</div>
    </div>
    <input type="password" id="pwInput" class="form-control mb-2" placeholder="รหัสผ่าน" autocomplete="current-password">
    <div id="pwError" class="text-danger mb-2" style="font-size:14px; display:none;">รหัสผ่านไม่ถูกต้อง ลองใหม่อีกครั้ง</div>
    <button class="btn btn-primary w-100 fw-bold py-2" onclick="checkPassword()">เข้าสู่ระบบ</button>
  </div>
</div>

<!-- ==================== ADMIN ==================== -->
<div id="adminScreen" style="display:none;">

  <div class="topbar">
    <div class="wrap">
      <div class="d-flex align-items-center justify-content-between gap-3">
        <h1>📋 SN Report</h1>
        <button class="btn btn-light btn-sm fw-bold" onclick="loadReports()">🔄 โหลดใหม่</button>
      </div>
      <div class="stat-row">
        <div class="stat"><b id="statPending">0</b><span>รอตรวจ</span></div>
        <div class="stat"><b id="statApproved">0</b><span>อนุมัติ</span></div>
        <div class="stat"><b id="statRejected">0</b><span>ปฏิเสธ</span></div>
        <div class="stat"><b id="statTotal">0</b><span>ทั้งหมด</span></div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="filter-bar">
      <button class="chip active" data-filter="pending"  onclick="setFilter('pending', this)">รอตรวจ</button>
      <button class="chip" data-filter="approved" onclick="setFilter('approved', this)">อนุมัติแล้ว</button>
      <button class="chip" data-filter="rejected" onclick="setFilter('rejected', this)">ปฏิเสธ</button>
      <button class="chip" data-filter="all"      onclick="setFilter('all', this)">ทั้งหมด</button>
    </div>

    <!-- มือถือ -->
    <div id="mobileView"><div id="reportList"></div></div>

    <!-- เดสก์ท็อป -->
    <div id="desktopView">
      <aside class="sidebar">
        <div class="sidebar-title">Code ที่ถูก Report</div>
        <div id="codeSidebar"></div>
      </aside>
      <section class="detail" id="codeDetail"></section>
    </div>
  </div>
</div>

<!-- ==================== CONFIRM MODAL ==================== -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:18px;">
      <div class="modal-body p-4">
        <div id="confirmTitle" class="fw-bold mb-1" style="font-size:19px;"></div>
        <div id="confirmSN" class="text-muted mb-3" style="font-size:14px; word-break:break-all;"></div>

        <label class="fw-bold mb-1" style="font-size:15px;">ความเห็น Admin</label>
        <textarea id="adminComment" class="form-control mb-3" rows="3" placeholder="ระบุเหตุผล (ถ้ามี)"></textarea>

        <div class="d-flex gap-2">
          <button class="btn btn-light flex-fill fw-bold" data-bs-dismiss="modal">ยกเลิก</button>
          <button id="confirmBtn" class="btn btn-primary flex-fill fw-bold" onclick="submitDecision()">ยืนยัน</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast-box"><div id="toastMsg" class="toast-msg"></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// ==========================================================
// ⚙️ CONFIG — แก้รหัสผ่านตรงนี้
// ==========================================================
const ADMIN_PASSWORD = "CHANGE_ME";

const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw9FUQVEOripWQc7x2l7wmL1krMRsh5M_ouW5LGLJonBOXW62H4J850YvPUigJfrFnl/exec";

async function callGAS(actionName, payloadData = {}) {
  const response = await fetch(GAS_API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: actionName, data: payloadData })
  });
  const result = await response.json();
  if (result.status === "error") throw new Error(result.message);
  return result.data;
}

// ==========================================================
// 🔐 Login
// ==========================================================
function checkPassword(){
  const input = document.getElementById("pwInput");
  if (input.value === ADMIN_PASSWORD){
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("adminScreen").style.display = "block";
    loadReports();
  } else {
    document.getElementById("pwError").style.display = "block";
    input.value = "";
    input.focus();
  }
}
document.getElementById("pwInput").addEventListener("keydown", e => {
  if (e.key === "Enter") checkPassword();
});

// ==========================================================
// 📦 State
// ==========================================================
let allReports = [];
let currentFilter = "pending";
let selectedKey = null;              // "วันที่||CODE" ของ Code ที่เลือกฝั่ง Desktop
let checkedRows = new Set();         // rowIndex ที่ติ๊กไว้
let pendingDecision = null;          // { rowIndexes:[], status, label }

// ใช้ matchMedia ไม่ใช่ resize — คีย์บอร์ดมือถือเด้งจะไม่ trigger re-render
const mqDesktop = window.matchMedia("(min-width: 992px)");
mqDesktop.addEventListener("change", () => renderAll());

// ==========================================================
// 🔄 Load
// ==========================================================
async function loadReports(){
  showLoading();
  try {
    const data = await callGAS("getSNReports");
    allReports = Array.isArray(data) ? data : [];
    checkedRows.clear();
    updateStats();
    renderAll();
  } catch (err){
    showError(err.message);
  }
}

function showLoading(){
  const box = `<div class="state-box"><span class="icon">⏳</span>กำลังโหลดรายการ...</div>`;
  document.getElementById("reportList").innerHTML = box;
  document.getElementById("codeDetail").innerHTML = box;
  document.getElementById("codeSidebar").innerHTML = "";
}

function showError(msg){
  const box = `<div class="state-box">
      <span class="icon">⚠️</span>โหลดรายการไม่สำเร็จ<br>
      <span style="font-size:14px;">${escapeHtml(msg)}</span><br>
      <button class="btn btn-primary btn-sm mt-3 fw-bold" onclick="loadReports()">ลองใหม่</button>
    </div>`;
  document.getElementById("reportList").innerHTML = box;
  document.getElementById("codeDetail").innerHTML = box;
}

// ==========================================================
// 🏷️ Status helper
// ==========================================================
function normalizeStatus(raw){
  const s = String(raw || "").trim().toLowerCase();
  if (s === "approved" || s === "approve" || s === "อนุมัติ") return "approved";
  if (s === "rejected" || s === "reject" || s === "ปฏิเสธ")  return "rejected";
  return "pending";
}
const STATUS_LABEL = { pending:"รอตรวจ", approved:"อนุมัติแล้ว", rejected:"ปฏิเสธ" };

function updateStats(){
  const c = { pending:0, approved:0, rejected:0 };
  allReports.forEach(r => c[normalizeStatus(r.status)]++);
  document.getElementById("statPending").innerText  = c.pending;
  document.getElementById("statApproved").innerText = c.approved;
  document.getElementById("statRejected").innerText = c.rejected;
  document.getElementById("statTotal").innerText    = allReports.length;
}

function setFilter(f, el){
  currentFilter = f;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  el.classList.add("active");
  checkedRows.clear();
  renderAll();
}

// ==========================================================
// 🧱 Grouping — วันที่ + Code
// ==========================================================
function getFilteredRows(){
  return allReports.filter(r =>
    currentFilter === "all" || normalizeStatus(r.status) === currentFilter);
}

function buildGroups(rows){
  const map = new Map();
  rows.forEach(r => {
    const date = fmtDate(r.reportDate);
    const code = String(r.code || "-");
    const key  = date + "||" + code;
    if (!map.has(key)) map.set(key, { key, date, code, zone:r.zone || "-", items:[] });
    map.get(key).items.push(r);
  });
  // วันที่ใหม่ก่อน แล้วเรียง Code A→Z
  return [...map.values()].sort((a,b) =>
    a.date === b.date ? a.code.localeCompare(b.code) : b.date.localeCompare(a.date));
}

function renderAll(){
  if (mqDesktop.matches) renderDesktop();
  else renderMobile();
}

// ==========================================================
// 🖥️ DESKTOP — sidebar + ตาราง SN
// ==========================================================
function renderDesktop(){
  const groups = buildGroups(getFilteredRows());
  const sidebar = document.getElementById("codeSidebar");
  const detail  = document.getElementById("codeDetail");

  if (!groups.length){
    sidebar.innerHTML = "";
    detail.innerHTML = `<div class="state-box"><span class="icon">📭</span>
      ไม่มีรายการในหมวด "${STATUS_LABEL[currentFilter] || "ทั้งหมด"}"</div>`;
    return;
  }

  // ถ้า Code ที่เลือกไว้หายไป (เปลี่ยน filter) ให้เด้งไปอันแรก
  if (!groups.some(g => g.key === selectedKey)) selectedKey = groups[0].key;

  // ----- Sidebar -----
  let html = "", lastDate = null;
  groups.forEach(g => {
    if (g.date !== lastDate){
      html += `<div class="side-date">📅 ${escapeHtml(g.date)}</div>`;
      lastDate = g.date;
    }
    const pendingCount = g.items.filter(r => normalizeStatus(r.status) === "pending").length;
    html += `
      <div class="side-item ${g.key === selectedKey ? "active" : ""}" onclick="selectCode('${escapeAttr(g.key)}')">
        <span class="code">${escapeHtml(g.code)}</span>
        <span class="zone-tag">${escapeHtml(g.zone)}</span>
        <span class="side-count ${pendingCount ? "has-pending" : ""}">${pendingCount || g.items.length}</span>
      </div>`;
  });
  sidebar.innerHTML = html;

  // ----- Detail -----
  const g = groups.find(x => x.key === selectedKey);
  const pendingItems = g.items.filter(r => normalizeStatus(r.status) === "pending");
  const checkedHere  = g.items.filter(r => checkedRows.has(r.rowIndex)).length;
  const allChecked   = pendingItems.length > 0 && checkedHere === pendingItems.length;

  const bulkBar = pendingItems.length ? `
    <div class="bulk-bar">
      <label class="d-flex align-items-center gap-2 mb-0" style="cursor:pointer;">
        <input type="checkbox" ${allChecked ? "checked" : ""} onchange="toggleAll(this.checked)">
        เลือกทั้งหมดที่รอตรวจ (${pendingItems.length})
      </label>
      ${checkedHere ? `
        <span class="ms-auto">เลือกไว้ ${checkedHere} รายการ</span>
        <button class="btn btn-success btn-sm" onclick="askBulk('Approved')">✅ อนุมัติที่เลือก</button>
        <button class="btn btn-danger btn-sm"  onclick="askBulk('Rejected')">❌ ปฏิเสธที่เลือก</button>
      ` : `<span class="ms-auto text-muted fw-normal">ติ๊กเลือกเพื่อจัดการหลายรายการพร้อมกัน</span>`}
    </div>` : "";

  const rowsHtml = g.items.map(buildRow).join("");

  detail.innerHTML = `
    <div class="detail-head">
      <h2>🏷️ ${escapeHtml(g.code)} <span class="zone-tag">Zone ${escapeHtml(g.zone)}</span></h2>
      <div class="detail-sub">📅 ${escapeHtml(g.date)} · SN ที่ถูก Report ทั้งหมด ${g.items.length} รายการ · รอตรวจ ${pendingItems.length}</div>
      ${bulkBar}
    </div>
    <div class="table-scroll">
      <table class="sn-table">
        <thead><tr>
          <th class="col-chk"></th>
          <th>SN</th><th>RC</th><th>อายุ</th><th>เหตุผล</th>
          <th>แจ้งเมื่อ</th><th>สถานะ</th><th class="col-act">จัดการ</th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>`;
}

function buildRow(r){
  const st = normalizeStatus(r.status);
  const isPending = st === "pending";
  const checked = checkedRows.has(r.rowIndex);

  const chk = isPending
    ? `<input type="checkbox" ${checked ? "checked" : ""} onchange="toggleRow(${r.rowIndex}, this.checked)">`
    : "";

  const act = isPending
    ? `<button class="btn btn-success btn-sm me-1" onclick="askSingle(${r.rowIndex},'Approved','${escapeAttr(r.sn)}')">✅</button>
       <button class="btn btn-danger btn-sm" onclick="askSingle(${r.rowIndex},'Rejected','${escapeAttr(r.sn)}')">❌</button>`
    : `<span class="text-muted" style="font-size:13px;">${escapeHtml(fmtDateTime(r.approvedAt))}</span>`;

  return `
    <tr class="${checked ? "is-selected" : ""}">
      <td class="col-chk">${chk}</td>
      <td class="col-sn">${escapeHtml(r.sn || "-")}</td>
      <td>${escapeHtml(r.rc || "-")}</td>
      <td>${r.age !== "" && r.age != null ? escapeHtml(r.age) : "-"}</td>
      <td>${escapeHtml(r.reason || "-")}
        ${r.note ? `<div class="col-note">${escapeHtml(r.note)}</div>` : ""}
        ${!isPending && r.adminComment ? `<div class="col-note">💬 ${escapeHtml(r.adminComment)}</div>` : ""}
      </td>
      <td style="white-space:nowrap;">${escapeHtml(fmtDateTime(r.timestamp))}</td>
      <td><span class="badge-status badge-${st}">${STATUS_LABEL[st]}</span></td>
      <td class="col-act">${act}</td>
    </tr>`;
}

function selectCode(key){
  selectedKey = key;
  checkedRows.clear();
  renderDesktop();
}

function toggleRow(rowIndex, on){
  if (on) checkedRows.add(rowIndex); else checkedRows.delete(rowIndex);
  renderDesktop();
}

function toggleAll(on){
  const g = buildGroups(getFilteredRows()).find(x => x.key === selectedKey);
  if (!g) return;
  g.items.filter(r => normalizeStatus(r.status) === "pending")
         .forEach(r => on ? checkedRows.add(r.rowIndex) : checkedRows.delete(r.rowIndex));
  renderDesktop();
}

// ==========================================================
// 📱 MOBILE — card list
// ==========================================================
function renderMobile(){
  const list = document.getElementById("reportList");
  const groups = buildGroups(getFilteredRows());

  if (!groups.length){
    list.innerHTML = `<div class="state-box"><span class="icon">📭</span>
      ไม่มีรายการในหมวด "${STATUS_LABEL[currentFilter] || "ทั้งหมด"}"</div>`;
    return;
  }

  let html = "", lastDate = null;
  groups.forEach(g => {
    if (g.date !== lastDate){
      html += `<div class="date-header">📅 ${escapeHtml(g.date)}</div>`;
      lastDate = g.date;
    }
    html += `
      <div class="code-header">
        <span>🏷️ ${escapeHtml(g.code)}</span>
        <span class="zone-tag">Zone ${escapeHtml(g.zone)}</span>
        <span class="ms-auto text-muted" style="font-size:13px;">${g.items.length} SN</span>
      </div>
      ${g.items.map(buildCard).join("")}`;
  });
  list.innerHTML = html;
}

function buildCard(r){
  const st = normalizeStatus(r.status);
  const isPending = st === "pending";

  const meta = [
    r.rc ? `RC: ${escapeHtml(r.rc)}` : "",
    r.age !== "" && r.age != null ? `อายุ: ${escapeHtml(r.age)} วัน` : "",
    r.timestamp ? `แจ้ง: ${escapeHtml(fmtDateTime(r.timestamp))}` : ""
  ].filter(Boolean).map(t => `<span>${t}</span>`).join("");

  const adminNote = (!isPending && (r.adminComment || r.approvedAt))
    ? `<div class="admin-note">
         ${r.adminComment ? `💬 ${escapeHtml(r.adminComment)}<br>` : ""}
         ${r.approvedAt ? `🕐 ${escapeHtml(fmtDateTime(r.approvedAt))}` : ""}
       </div>` : "";

  const actions = isPending
    ? `<div class="action-row">
         <button class="btn btn-success" onclick="askSingle(${r.rowIndex},'Approved','${escapeAttr(r.sn)}')">✅ อนุมัติ</button>
         <button class="btn btn-danger"  onclick="askSingle(${r.rowIndex},'Rejected','${escapeAttr(r.sn)}')">❌ ปฏิเสธ</button>
       </div>` : "";

  return `
  <div class="report-card ${st}">
    <div class="d-flex justify-content-between align-items-start">
      <div class="sn-line">${escapeHtml(r.sn || "-")}</div>
      <span class="badge-status badge-${st}">${STATUS_LABEL[st]}</span>
    </div>
    <div class="meta">${meta}</div>
    <div class="reason">
      📌 ${escapeHtml(r.reason || "ไม่ระบุเหตุผล")}
      ${r.note ? `<span class="note">${escapeHtml(r.note)}</span>` : ""}
    </div>
    ${adminNote}
    ${actions}
  </div>`;
}

// ==========================================================
// ✅ Approve / Reject (เดี่ยว + หลายรายการ)
// ==========================================================
let confirmModalInstance = null;

function openConfirm(rowIndexes, status, label){
  pendingDecision = { rowIndexes, status, label };
  const isApprove = status === "Approved";

  document.getElementById("confirmTitle").innerText =
    isApprove ? `อนุมัติ ${rowIndexes.length} รายการ?` : `ปฏิเสธ ${rowIndexes.length} รายการ?`;
  document.getElementById("confirmSN").innerText = label;
  document.getElementById("adminComment").value = "";

  const btn = document.getElementById("confirmBtn");
  btn.className = "btn flex-fill fw-bold " + (isApprove ? "btn-success" : "btn-danger");
  btn.innerText = isApprove ? "ยืนยันอนุมัติ" : "ยืนยันปฏิเสธ";
  btn.disabled = false;

  confirmModalInstance = confirmModalInstance || new bootstrap.Modal(document.getElementById("confirmModal"));
  confirmModalInstance.show();
}

function askSingle(rowIndex, status, sn){
  openConfirm([rowIndex], status, "SN: " + sn);
}

function askBulk(status){
  const ids = [...checkedRows];
  if (!ids.length) return;
  openConfirm(ids, status, `${ids.length} SN ที่เลือกไว้ — ใส่ comment เดียวกันทุกรายการ`);
}

async function submitDecision(){
  if (!pendingDecision) return;
  const { rowIndexes, status } = pendingDecision;
  const comment = document.getElementById("adminComment").value.trim();

  const btn = document.getElementById("confirmBtn");
  btn.disabled = true;

  let done = 0, failed = 0;
  for (const rowIndex of rowIndexes){
    btn.innerText = `กำลังบันทึก ${done + 1}/${rowIndexes.length}...`;
    try {
      await callGAS("updateSNReport", { rowIndex, status, adminComment: comment });
      const target = allReports.find(r => r.rowIndex === rowIndex);
      if (target){
        target.status = status;
        target.adminComment = comment;
        target.approvedAt = new Date().toISOString();
      }
      checkedRows.delete(rowIndex);
      done++;
    } catch (err){
      failed++;
    }
  }

  confirmModalInstance.hide();
  updateStats();
  renderAll();
  pendingDecision = null;

  if (failed) showToast(`สำเร็จ ${done} · ล้มเหลว ${failed} รายการ`, "warn");
  else showToast(`${status === "Approved" ? "อนุมัติ" : "ปฏิเสธ"}แล้ว ${done} รายการ`, "ok");
}

// ==========================================================
// 🔧 Utils
// ==========================================================
function fmtDate(v){
  if (!v) return "ไม่ระบุวันที่";
  const d = new Date(v);
  if (isNaN(d)) return String(v);
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

function fmtDateTime(v){
  if (!v) return "";
  const d = new Date(v);
  if (isNaN(d)) return String(v);
  const p = n => String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, m =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[m]));
}

function escapeAttr(s){
  return String(s ?? "").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;");
}

let toastTimer = null;
function showToast(msg, type = ""){
  const el = document.getElementById("toastMsg");
  el.innerText = msg;
  el.className = "toast-msg show " + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}
</script>
